name: Container build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build pinned environment
        run: docker build --tag rpi5-uefi-builder:12.3 .

      - name: Build firmware from clean pinned sources
        run: docker run --rm --volume "$PWD:/project" rpi5-uefi-builder:12.3
