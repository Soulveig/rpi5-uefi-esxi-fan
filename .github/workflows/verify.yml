name: Verify release sources

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify scripts and firmware checksum
        run: |
          bash -n scripts/*.sh
          python3 scripts/verify-docs.py
          sha256sum --check SHA256SUMS

      - name: Check for accidental private data
        run: |
          if git grep -I -nE '(/Users/adm|10\.0\.1\.[0-9]+|BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY|admin[[:space:]]*[/\\][[:space:]]*admin)' -- \
            ':!*.jpg' ':!firmware/*' ':!.github/workflows/verify.yml'; then
            echo 'Accidental local path, credential, or private key marker found.' >&2
            exit 1
          fi

      - name: Verify patches against pinned upstream commits
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/NumberOneGit/edk2-platforms.git /tmp/edk2-platforms
          git -C /tmp/edk2-platforms fetch --depth=1 origin 5654030569418c46e5a46066c495d4fad852b4f8
          git -C /tmp/edk2-platforms checkout --detach FETCH_HEAD
          git -C /tmp/edk2-platforms apply --check "$GITHUB_WORKSPACE/patches/0001-rpi5-esxi-acpi-waveshare-fan.patch"

          git clone --filter=blob:none --no-checkout https://github.com/NumberOneGit/rpi5-uefi.git /tmp/rpi5-uefi
          git -C /tmp/rpi5-uefi fetch --depth=1 origin ba315b63ffc778b633911416c0adedfc2a2763a7
          git -C /tmp/rpi5-uefi checkout --detach FETCH_HEAD
          git -C /tmp/rpi5-uefi apply --check "$GITHUB_WORKSPACE/patches/0002-macos-build-compatibility.patch"

      - name: Verify changelog entry for tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -Fq "## [$version]" CHANGELOG.md
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out verified tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            firmware/RPI_EFI.fd \
            SHA256SUMS \
            patches/*.patch \
            --verify-tag \
            --title "Raspberry Pi 5 UEFI $GITHUB_REF_NAME" \
            --generate-notes
